name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const p=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; if ('v'+p.version !== tag) { console.error('tag '+tag+' does not match package version '+p.version); process.exit(1) }"
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
      - name: Tests
        run: npm test
      - name: Publish to npm (trusted publishing via OIDC)
        run: npm publish --provenance --access public
